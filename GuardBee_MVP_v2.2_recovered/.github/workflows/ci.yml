name: GuardBee CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate JSON syntax and required fields
        run: |
          python -c "from pathlib import Path; from data_loader import load_incidents, load_policies; root = Path('.'); load_incidents(root / 'data' / 'incidents.json'); load_policies(root / 'data' / 'policies.json'); print('JSON schema validation passed')"
      - name: Ensure Streamlit secret file is not tracked
        run: |
          if git ls-files --error-unmatch .streamlit/secrets.toml; then
            echo '.streamlit/secrets.toml must not be tracked'
            exit 1
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
